<!doctype html>
<html lang="{{ site.Language.Lang | default "en" }}">
<head>
  {{- partial "head.html" . }}
</head>
<body data-harmonic="{{ site.Params.harmonic | default dict | jsonify }}">
  <a class="skip" href="#main">Skip to content</a>
  {{- partial "header.html" . }}
  <main id="main" class="wrap">
    {{- block "main" . }}{{ end }}
  </main>
  {{- partial "footer.html" . }}
  {{- $js := resources.Get "js/harmonic.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
</body>
</html>
